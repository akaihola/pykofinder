<!DOCTYPE html>
<html lang="en" data-density="compact">
<head>
<meta charset="utf-8">
<title>Pykoclaw — Miller Columns design study</title>
<script src="vendor/seti-map.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   PYKOCLAW MILLER COLUMNS — "Trail"
   Design tokens. Everything downstream is derived from these.
   ═══════════════════════════════════════════════════════════════════════════ */
@font-face {
  font-family: "seti";
  src: url("vendor/seti.woff") format("woff");
  font-display: block;
}

:root {
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "Helvetica Neue", sans-serif;
  --mono: "SF Mono", "JetBrains Mono", "Fira Code", ui-monospace, monospace;

  --fs-row: 12px;
  --fs-head: 12px;
  --fs-meta: 11px;

  /* density-driven */
  --row-h: 21px;
  --row-gap: 1px;
  --head-h: 26px;
  --col-pad: 4px;      /* inset gutter each side of a row */
  --gutter: 10px;      /* space between columns — where the trail lives */
  --radius: 5px;
  --spine-w: 34px;

  /* light palette */
  --accent:        #2f6df6;
  --accent-weak:   color-mix(in srgb, var(--accent) 13%, transparent);
  --accent-soft:   color-mix(in srgb, var(--accent) 30%, transparent);
  --accent-ink:    color-mix(in srgb, var(--accent) 88%, #000 12%);

  --chrome:        #e7e7ec;   /* window / gutter background */
  --surface:       #ffffff;   /* focused column */
  --surface-2:     #fbfbfd;   /* preview */
  --ink:           #16171a;
  --ink-2:         #55575e;   /* secondary text */
  --ink-3:         #8b8d96;   /* tertiary / counts */
  --hairline:      rgba(0,0,0,.085);
  --hairline-2:    rgba(0,0,0,.14);
  --hover:         rgba(0,0,0,.045);
  --shadow-col:    0 0 0 .5px rgba(0,0,0,.05), 0 1px 3px rgba(0,0,0,.05);
  --recede:        #000;      /* what ancestors fade toward */
  --recede-amt:    3.2%;      /* per-level recession */
}

:root[data-density="comfortable"] {
  --row-h: 26px; --head-h: 30px; --fs-row: 13px; --radius: 7px;
  --col-pad: 5px; --gutter: 13px;
}

:root[data-theme="dark"] {
  --accent:      #5b8dff;
  --accent-ink:  color-mix(in srgb, var(--accent) 92%, #fff 8%);
  --chrome:      #1b1d21;
  --surface:     #26292e;
  --surface-2:   #22252a;
  --ink:         #e9eaee;
  --ink-2:       #a4a8b2;
  --ink-3:       #71757f;
  --hairline:    rgba(255,255,255,.075);
  --hairline-2:  rgba(255,255,255,.13);
  --hover:       rgba(255,255,255,.06);
  --shadow-col:  0 0 0 .5px rgba(0,0,0,.5), 0 1px 4px rgba(0,0,0,.35);
  --recede:      #000;
  --recede-amt:  4.5%;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; font-family: var(--font); font-size: var(--fs-row);
  color: var(--ink); background: var(--chrome);
  overflow: hidden; -webkit-font-smoothing: antialiased;
}

/* ── App shell ─────────────────────────────────────────────────────────── */
#shell { display: flex; flex-direction: column; height: 100%; }

/* ── Breadcrumb / toolbar ──────────────────────────────────────────────── */
#bar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 2px;
  height: 36px; padding: 0 8px 0 10px;
  background: color-mix(in srgb, var(--chrome) 70%, var(--surface));
  border-bottom: 1px solid var(--hairline);
  font-size: var(--fs-head);
}
#crumbs { display: flex; align-items: center; gap: 1px; min-width: 0; overflow: hidden; }
.crumb {
  padding: 3px 7px; border-radius: 5px; color: var(--ink-2); cursor: pointer;
  white-space: nowrap;
}
.crumb:hover { background: var(--hover); color: var(--ink); }
.crumb.here { color: var(--ink); font-weight: 590; }
.crumb-sep { color: var(--ink-3); opacity: .55; user-select: none; }
.spacer { flex: 1; }

/* ── Settings popover ──────────────────────────────────────────────────── */
#gear {
  font: inherit; font-size: 14px; line-height: 1; color: var(--ink-2);
  background: transparent; border: 0; border-radius: 6px;
  width: 26px; height: 24px; cursor: pointer;
}
#gear:hover, #gear[aria-expanded="true"] { background: var(--hover); color: var(--ink); }
#settings {
  position: absolute; top: 34px; right: 8px; z-index: 40; min-width: 210px;
  padding: 5px; border-radius: 9px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--hairline);
  box-shadow: 0 8px 28px rgba(0,0,0,.18), 0 0 0 .5px rgba(0,0,0,.06);
}
#settings[hidden] { display: none; }
#settings .grp {
  padding: 6px 9px 3px; font-size: 10px; letter-spacing: .5px;
  text-transform: uppercase; color: var(--ink-3);
}
#settings button {
  display: flex; align-items: center; gap: 8px; width: 100%;
  font: inherit; font-size: var(--fs-head); text-align: left; color: inherit;
  background: transparent; border: 0; border-radius: 6px;
  padding: 5px 9px; cursor: pointer;
}
#settings button:hover { background: var(--hover); }
#settings button .tick { width: 13px; color: var(--accent); opacity: 0; }
#settings button[aria-checked="true"] .tick { opacity: 1; }
#settings hr { border: 0; border-top: 1px solid var(--hairline); margin: 5px 4px; }

/* ═══════════════════════════════════════════════════════════════════════════
   Horizontal scroll = condensing control.
   #finder scrolls; #rail supplies the scroll range; #stage sticks to the
   viewport so nothing actually translates — the scroll position is read as a
   0–100% dial that folds columns from the left.
   ═══════════════════════════════════════════════════════════════════════════ */
#finder {
  flex: 1; min-height: 0; overflow-x: auto; overflow-y: hidden;
  scrollbar-width: thin; scrollbar-color: var(--hairline-2) transparent;
}
#finder::-webkit-scrollbar { height: 9px; }
#finder::-webkit-scrollbar-thumb {
  background: var(--hairline-2); border-radius: 5px;
  border: 2px solid transparent; background-clip: content-box;
}
#rail { height: 100%; }
#stage {
  position: sticky; left: 0; height: 100%;
  width: var(--stage-w, 100%);
  overflow: clip;   /* clip, not hidden: never becomes a scrollable container */
}
#strip {
  display: flex; align-items: stretch; height: 100%; gap: var(--gutter);
  padding: var(--gutter);
  /* overflow the stage when the columns don't fit, stretch to it when they do
     — the latter is what lets #preview's flex-grow claim the spare space */
  width: max-content; min-width: 100%;
  will-change: transform;
}

/* the trail overlay is painted between columns */
#trail {
  position: absolute; inset: 0; pointer-events: none; z-index: 3; overflow: visible;
}
#trail path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; }
#trail path.thread { stroke: var(--accent-soft); }
/* marks an elbow whose row is scrolled out of its column: which way it went */
#trail path.caret { stroke-width: 1.6; stroke-linejoin: round; }

/* ── A column ──────────────────────────────────────────────────────────── */
.col {
  position: relative; flex: 0 0 auto;
  display: flex; flex-direction: column; min-height: 0;
  border-radius: 10px;
  background: var(--surface);
  box-shadow: var(--shadow-col);
  transition: background-color .18s;   /* NOT width: folding tracks the scroll 1:1 */
  --fold: 0;
}
/* Depth recession: ancestors sink toward the chrome, focus stays bright. */
.col[data-depth="1"] { background: color-mix(in srgb, var(--surface) calc(100% - 1 * var(--recede-amt)), var(--recede)); }
.col[data-depth="2"] { background: color-mix(in srgb, var(--surface) calc(100% - 2 * var(--recede-amt)), var(--recede)); }
.col[data-depth="3"] { background: color-mix(in srgb, var(--surface) calc(100% - 3 * var(--recede-amt)), var(--recede)); }
.col[data-depth="4"] { background: color-mix(in srgb, var(--surface) calc(100% - 4 * var(--recede-amt)), var(--recede)); }
.col[data-depth="5"] { background: color-mix(in srgb, var(--surface) calc(100% - 5 * var(--recede-amt)), var(--recede)); }

/* Column header — the thing macOS Finder is missing. */
.col-head {
  flex: 0 0 auto; height: var(--head-h);
  display: flex; align-items: center; gap: 6px;
  padding: 0 9px; border-bottom: 1px solid var(--hairline);
  border-radius: 10px 10px 0 0;
  font-size: var(--fs-head); font-weight: 590; color: var(--ink-2);
  white-space: nowrap; overflow: hidden;
}
.col-head .name {
  overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left;
}
.col-head .name > span { direction: ltr; unicode-bidi: embed; }
.col-head .count {
  margin-left: auto; font-size: var(--fs-meta); font-weight: 450;
  color: var(--ink-3); font-variant-numeric: tabular-nums;
}
.col.focus .col-head { color: var(--ink); }
.col.focus .col-head::after {
  content: ""; position: absolute; left: 9px; right: 9px;
  top: calc(var(--head-h) - 2px); height: 2px; border-radius: 2px;
  background: var(--accent);
}

/* Scroll body + edge fade so a long list never looks truncated by accident */
.col-body {
  flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
  padding: var(--col-pad) 0;
  scrollbar-width: thin; scrollbar-color: var(--hairline-2) transparent;
}
.col-body::-webkit-scrollbar { width: 8px; }
.col-body::-webkit-scrollbar-thumb {
  background: var(--hairline-2); border-radius: 4px;
  border: 2px solid transparent; background-clip: content-box;
}
.col::after { /* bottom scroll fade */
  content: ""; position: absolute; left: 1px; right: 1px; bottom: 1px; height: 22px;
  border-radius: 0 0 10px 10px; pointer-events: none; opacity: 0;
  background: linear-gradient(to top, var(--surface), transparent);
  transition: opacity .15s;
}
.col.scrollable-down::after { opacity: .95; }

/* ── Rows ──────────────────────────────────────────────────────────────── */
.row {
  display: flex; align-items: center; gap: 7px;
  height: var(--row-h); margin: var(--row-gap) var(--col-pad);
  padding: 0 6px 0 6px; border-radius: var(--radius);
  cursor: default; user-select: none; white-space: nowrap;
  border: 1px solid transparent; position: relative;
}
.row .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.row .label .dim { color: var(--ink-3); }   /* extension is de-emphasised */
.row .chev {
  flex: 0 0 auto; color: var(--ink-3); font-size: 11px; opacity: .7;
  transform: translateY(-.5px);
}
.row.dotfile { opacity: .5; }
.row:hover:not(.sel) { background: var(--hover); }

/* ── Icons: Seti glyph for files, drawn folder for directories ─────────── */
.ico {
  flex: 0 0 16px; width: 16px; height: 16px;
  display: grid; place-items: center; line-height: 1;
}
.ico.seti { font-family: "seti"; font-size: 14px; }
.ico.dir svg { width: 14px; height: 14px; fill: var(--ink-3); }

/* Three distinct selection states — all legible, unlike Finder's grey-out. */
/* 1. FOCUS column: solid accent — "you are here". */
.col.focus .row.sel { background: var(--accent); color: #fff; }
.col.focus .row.sel .chev,
.col.focus .row.sel .label .dim { color: rgba(255,255,255,.72); }
.col.focus .row.sel .ico.seti { color: #fff !important; }
.col.focus .row.sel .ico.dir svg { fill: #fff; }

/* 2. ANCESTOR columns: tinted pill — "the trail you walked". */
.col.ancestor .row.sel {
  background: var(--accent-weak); border-color: var(--accent-soft);
  color: var(--accent-ink); font-weight: 560;
}
.col.ancestor .row.sel .chev { color: var(--accent-soft); }
.col.ancestor .row.sel .ico.dir svg { fill: var(--accent); }

/* 3. DESCENDANT columns: ghost pill — "remembered, not active". */
.col.descendant .row.sel {
  background: transparent; border-color: var(--hairline-2);
  border-style: dashed; color: var(--ink-2);
}

/* keyboard cursor ring, independent of selection */
.row.cursor { box-shadow: 0 0 0 2px var(--accent), 0 0 0 4px var(--accent-weak); }
.col.focus .row.cursor.sel { box-shadow: none; }

/* ── Folding: continuous, driven straight off the scroll dial ──────────── */
/* --fold runs 0→1 across the column's own step of the dial. Width is
   interpolated in JS; the crossfade below rides the same number, so the
   column narrows and turns into its spine in one continuous motion. */
.col.spine { width: var(--spine-w) !important; cursor: pointer; }
.col.spine .col-head, .col.spine .col-body { display: none; }
.col.folding .col-head, .col.folding .col-body {
  opacity: clamp(0, calc(1.6 - var(--fold) * 2), 1);
}
.spine-label {
  position: absolute; inset: 0; z-index: 2;
  display: flex; flex-direction: column; align-items: center;
  gap: 9px; padding: 9px 0; overflow: hidden;
  opacity: 0; pointer-events: none;
}
.col.spine .spine-label { opacity: 1; }
.col.folding .spine-label { opacity: clamp(0, calc(var(--fold) * 2 - 1), 1); }
/* the chosen child stays visible even when its column is folded away */
.spine-label .dot {
  flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--accent-weak); box-shadow: inset 0 0 0 1px var(--accent-soft);
}
.spine-label .txt {
  writing-mode: vertical-rl; text-orientation: mixed;
  font-size: var(--fs-meta); color: var(--ink-2); letter-spacing: .2px;
  overflow: hidden; text-overflow: ellipsis; max-height: 100%;
}
.col.spine:hover { background: var(--surface); }
.col.spine:hover .txt { color: var(--ink); }

/* ── Preview pane ──────────────────────────────────────────────────────── */
/* grow into spare space, never shrink below the target reading width */
#preview {
  /* definite width so an unbroken title can't inflate #strip's max-content;
     flex-grow still hands it every pixel the folded columns give back */
  width: var(--preview-w, 520px); flex: 1 0 auto; border-radius: 10px;
  background: var(--surface-2); box-shadow: var(--shadow-col);
  display: flex; flex-direction: column; min-height: 0; overflow: hidden;
}
#preview .pv-body { flex: 1; min-height: 0; overflow: auto; padding: 22px 26px; }
.pv-hero {
  display: flex; align-items: center; gap: 14px; margin-bottom: 18px;
  padding-bottom: 16px; border-bottom: 1px solid var(--hairline);
}
.pv-hero .ico { width: 42px; height: 42px; flex-basis: 42px; }
.pv-hero .ico.seti { font-size: 38px; }
.pv-hero .ico.dir svg { width: 38px; height: 38px; }
.pv-hero h2 {
  margin: 0 0 3px; font-size: 16px; font-weight: 600;
  overflow-wrap: anywhere;   /* vault titles run to 80+ characters */
}
.meta dd, .pv-body p { overflow-wrap: anywhere; }
.pv-hero .sub { color: var(--ink-3); font-size: var(--fs-meta); }
.pv-body p { color: var(--ink-2); line-height: 1.65; max-width: 62ch; }
.pv-body code { font-family: var(--mono); font-size: 12px;
  background: var(--hover); padding: 1px 5px; border-radius: 4px; }
.pv-empty {
  flex: 1; display: grid; place-content: center; text-align: center;
  color: var(--ink-3); gap: 6px;
}
.pv-empty .glyph { font-size: 34px; opacity: .35; }
.meta { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px;
  margin-top: 20px; font-size: 12px; }
.meta dt { color: var(--ink-3); }
.meta dd { margin: 0; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* ── Status strip ──────────────────────────────────────────────────────── */
#status {
  flex: 0 0 auto; height: 24px; display: flex; align-items: center; gap: 14px;
  padding: 0 12px; font-size: var(--fs-meta); color: var(--ink-3);
  border-top: 1px solid var(--hairline);
  background: color-mix(in srgb, var(--chrome) 70%, var(--surface));
}
#status kbd {
  font-family: var(--mono); font-size: 10px; padding: 1px 4px; border-radius: 3px;
  border: 1px solid var(--hairline-2); color: var(--ink-2);
}
#st-fold { color: var(--ink-2); }
#status span { white-space: nowrap; }
#st-path { overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 720px) { #status .hint { display: none; } }
</style>
</head>
<body>
<div id="shell">
  <div id="bar">
    <div id="crumbs"></div>
    <div class="spacer"></div>
    <button id="gear" aria-expanded="false" title="Settings">⚙</button>
    <div id="settings" hidden>
      <div class="grp">View</div>
      <button id="s-dot"     role="menuitemcheckbox" aria-checked="false"><span class="tick">✓</span>Show dotfiles</button>
      <button id="s-density" role="menuitemcheckbox" aria-checked="true"><span class="tick">✓</span>Compact rows</button>
      <hr>
      <div class="grp">Appearance</div>
      <button id="s-theme"   role="menuitemcheckbox" aria-checked="false"><span class="tick">✓</span>Dark theme</button>
    </div>
  </div>

  <div id="finder" role="group"
       aria-label="Columns — scroll horizontally to fold or unfold">
    <div id="rail">
      <div id="stage">
        <svg id="trail"></svg>
        <div id="strip"><!-- columns + preview injected here --></div>
      </div>
    </div>
  </div>

  <div id="status">
    <span id="st-path"></span>
    <div class="spacer"></div>
    <span id="st-fold"></span>
    <span class="hint"><kbd>↑</kbd><kbd>↓</kbd> move</span>
    <span class="hint"><kbd>→</kbd> open</span>
    <span class="hint"><kbd>←</kbd> back</span>
    <span class="hint"><kbd>⇧</kbd>+wheel fold</span>
  </div>
</div>

<script>

/* ═══════════════════════════════════════════════════════════════════════════
   Icons — Seti UI font (MIT), extension map generated by build-seti-map.py.
   A handful of extensions Seti has glyphs for but never mapped.
   ═══════════════════════════════════════════════════════════════════════════ */
/* Seti has glyphs for these but mapping.less never binds them to an extension. */
const SUPP = { nix: ["e019","#519aba"], db: ["e022","#dd4b78"], sqlite: ["e022","#dd4b78"],
               lock: ["e05d","#7fae42"], desktop: ["e019","#6d8086"],
               geojson: ["e055","#b7b73b"], vtt: ["e023","#bfc2c1"] };
const FOLDER_SVG =
  '<svg viewBox="0 0 16 16"><path d="M1.4 3.2h4.1l1.3 1.7h7.8c.6 0 1 .4 1 1v7c0 .6-.4 1-1 1H1.4c-.6 0-1-.4-1-1V4.2c0-.6.4-1 1-1z"/></svg>';

function iconHTML(node) {
  if (node.dir) return `<span class="ico dir">${FOLDER_SVG}</span>`;
  const lower = node.name.toLowerCase(), ext = lower.split(".").pop();
  const e = SETI.name[lower] || SETI.ext[ext] || SUPP[ext] || SETI.default;
  const color = (root.dataset.theme === "light" && SETI.light[ext]) || e[1];
  return `<span class="ico seti" style="color:${color}">&#x${e[0]};</span>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   State
   ═══════════════════════════════════════════════════════════════════════════ */
const root    = document.documentElement;
root.dataset.theme =
  matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
const finder  = document.getElementById("finder");
const rail    = document.getElementById("rail");
const stage   = document.getElementById("stage");
const strip   = document.getElementById("strip");
const trail   = document.getElementById("trail");

const START = ["my-knowledge", "pages", "Library", "Read Later"];
let path = START.reduce((acc, nm) => [...acc, acc.at(-1).kids.find(k => k.name === nm)], [TREE]);
let sel  = [...START, "Revenge of the PMO - Silicon Valley Product Group  Silicon Valley Product Group.md"];
let focusCol = START.length;
let cursor = {};                                         // col index -> row index
let widths = [];                                         // natural width per column
let folded = 0;                                          // columns currently folded
const state = { dotfiles: false };

const GUTTER = () => parseInt(getComputedStyle(root).getPropertyValue("--gutter"));
const SPINE  = () => parseInt(getComputedStyle(root).getPropertyValue("--spine-w"));

const visibleKids = node =>
  (node.kids || []).filter(k => state.dotfiles || !k.name.startsWith("."))
    .sort((a,b) => (!!b.dir - !!a.dir) || a.name.localeCompare(b.name, undefined, {numeric:true}));

/* Bring a row into view within its own column, touching nothing else.
   scrollIntoView() would also scroll #stage and #finder — and #finder's
   scrollLeft is the condensing dial, so it would silently move the fold. */
function revealRow(body, row) {
  if (!row) return;
  const top = row.offsetTop, h = row.offsetHeight;
  if (top < body.scrollTop) body.scrollTop = top - 4;
  else if (top + h > body.scrollTop + body.clientHeight)
    body.scrollTop = top + h - body.clientHeight + 4;
}

const splitName = name => {
  const i = name.lastIndexOf(".");
  return (i > 0) ? [name.slice(0,i), name.slice(i)] : [name, ""];
};

const previewNode = () => {
  const last = path[path.length - 1], s = sel[path.length - 1];
  const n = s && (last.kids || []).find(k => k.name === s);
  return (n && !n.dir) ? n : null;
};

/* target reading width for the preview — the thing scrolling tries to protect */
const previewTarget = () => {
  const w = finder.clientWidth - 2 * GUTTER();
  return Math.min(w, previewNode()
    ? Math.min(760, Math.max(420, Math.round(w * 0.45)))
    : 300);
};

function measure(node) {
  /* content-driven width, clamped — no manual resizing, no wasted space */
  const c = (measure._c ||= document.createElement("canvas").getContext("2d"));
  const cs = getComputedStyle(root);
  c.font = `${cs.getPropertyValue("--fs-row").trim()} ${cs.getPropertyValue("--font")}`;
  let w = 0;
  for (const k of visibleKids(node)) w = Math.max(w, c.measureText(k.name).width);
  c.font = `600 ${cs.getPropertyValue("--fs-head").trim()} ${cs.getPropertyValue("--font")}`;
  w = Math.max(w, c.measureText(node.name).width + 34);
  /* 380 not 268: a vault of 80-character page titles needs the room, and the
     dial makes wide columns affordable — fold what you are not reading. */
  return Math.min(380, Math.max(148, Math.ceil(w) + 58));
}

/* ═══════════════════════════════════════════════════════════════════════════
   Render
   ═══════════════════════════════════════════════════════════════════════════ */
function render(keepScroll) {
  strip.textContent = "";
  widths = path.map(measure);

  path.forEach((node, i) => {
    const kids = visibleKids(node);
    const col = document.createElement("div");
    col.className = "col " + (i < focusCol ? "ancestor" : i > focusCol ? "descendant" : "focus");
    col.dataset.depth = Math.min(5, Math.max(0, focusCol - i));
    col.dataset.i = i;
    col.style.width = widths[i] + "px";

    const chosen = kids.find(k => k.name === sel[i]);
    col.innerHTML = `
      <div class="col-head">
        <span class="name"><span>${node.name}</span></span>
        <span class="count">${kids.length}</span>
      </div>
      <div class="col-body" role="listbox" aria-label="${node.name}"></div>
      <div class="spine-label" title="${node.name} — click to unfold">
        <span class="dot">${chosen ? iconHTML(chosen) : ""}</span>
        <span class="txt">${node.name}</span>
      </div>`;

    const body = col.querySelector(".col-body");
    kids.forEach((k, ri) => {
      const [stem, ext] = splitName(k.name);
      const row = document.createElement("div");
      row.className = "row"
        + (sel[i] === k.name ? " sel" : "")
        + (k.name.startsWith(".") ? " dotfile" : "")
        + (i === focusCol && cursor[i] === ri ? " cursor" : "");
      row.title = k.name;   /* the full name is always one hover away */
      row.setAttribute("role", "option");
      row.setAttribute("aria-selected", String(sel[i] === k.name));
      row.innerHTML = iconHTML(k)
        + `<span class="label">${stem}<span class="dim">${ext}</span></span>`
        + (k.dir ? `<span class="chev">›</span>` : "");
      row.onclick = () => choose(i, k, ri);
      body.appendChild(row);
    });
    body.onscroll = paintTrail;

    strip.appendChild(col);
    col.classList.toggle("scrollable-down", body.scrollHeight > body.clientHeight + 4);
    revealRow(body, col.querySelector(".row.sel"));
  });

  strip.appendChild(renderPreview());
  renderCrumbs();
  layout(keepScroll);
}

function renderPreview() {
  const n = previewNode();
  const pv = document.createElement("div");
  pv.id = "preview";
  if (!n) {
    pv.innerHTML = `<div class="pv-empty"><div class="glyph">◫</div>
                    <div>Select a file to preview</div></div>`;
    return pv;
  }
  const [stem, ext] = splitName(n.name);
  pv.innerHTML = `
    <div class="col-head"><span class="name"><span>${n.name}</span></span></div>
    <div class="pv-body">
      <div class="pv-hero">
        ${iconHTML(n)}
        <div><h2>${stem}<span style="color:var(--ink-3)">${ext}</span></h2>
             <div class="sub">${n.size} · modified ${n.mod}</div></div>
      </div>
      <p>Scroll horizontally to trade column space for preview space. At the far
         left every column is unfolded and this pane runs off the right edge; at
         the far right the columns are gone and the preview owns the window.
         Everything in between folds one column at a time, from the left.</p>
      <dl class="meta">
        <dt>Where</dt><dd>${path.map(p => p.name).join(" / ")}</dd>
        <dt>Size</dt><dd>${n.size}</dd>
        <dt>Modified</dt><dd>${n.mod}</dd>
      </dl>
    </div>`;
  return pv;
}

/* ═══════════════════════════════════════════════════════════════════════════
   Layout + the scroll dial

   scrollLeft is not a translation — it is a 0–100% condensing dial:
     0%       every column unfolded; preview overflows off the right edge
     k·unit   the leftmost k columns folded to spines   (unit = 99% / ncols)
     99%      every column folded; preview fills what is left
     99–100%  the spine strip itself slides away; at 100% the preview is alone
   ═══════════════════════════════════════════════════════════════════════════ */
function stripSpan(k) {                     /* width of the column strip with k folded */
  const g = GUTTER(), n = path.length;
  const cols = widths.reduce((a, w, i) => a + (i < k ? SPINE() : w), 0);
  return cols + g * (n + 1);                /* padding either side + inter-column gaps */
}
const foldUnit = () => 0.99 / path.length;
const range    = () => Math.max(1, stripSpan(0) - GUTTER());

function layout(keepScroll) {
  const stageW = finder.clientWidth;
  root.style.setProperty("--stage-w", stageW + "px");
  root.style.setProperty("--preview-w", previewTarget() + "px");
  rail.style.width = (stageW + range()) + "px";

  if (!keepScroll) {
    /* default: the least folding that still gives the preview its full width */
    let k = 0;
    while (k < path.length && stripSpan(k) + previewTarget() > stageW) k++;
    /* on a phone even every column folded is too much — go all the way to 100%,
       where the spine strip slides off and the preview owns the window */
    const p = (stripSpan(k) + previewTarget() > stageW) ? 1 : k * foldUnit();
    finder.scrollLeft = Math.round(p * range());
  }
  applyScroll();
}

function applyScroll() {
  const max = Math.max(1, rail.clientWidth - finder.clientWidth);
  const p = Math.min(1, finder.scrollLeft / max);
  const n = path.length;

  /* the epsilon absorbs sub-pixel scrollLeft rounding at the fold boundaries */
  const raw = p / foldUnit() + 0.002;
  folded = Math.min(n, Math.floor(raw));
  /* how far into folding the next column is — 0 = full width, 1 = a spine */
  const t = Math.min(1, Math.max(0, raw - folded));

  [...strip.querySelectorAll(".col")].forEach((col, i) => {
    col.classList.toggle("spine", i < folded);
    col.classList.toggle("folding", i === folded && folded < n);
    if (i < folded) { col.style.width = ""; return; }
    col.dataset.fold = i === folded ? t : 0;
    col.style.setProperty("--fold", col.dataset.fold);
    col.style.width = (i === folded
      ? Math.round(widths[i] + (SPINE() - widths[i]) * t)
      : widths[i]) + "px";
  });

  /* last 1%: slide the spine strip itself off the left edge. Widening the strip
     by the same amount keeps the preview's flex-grow filling to the right edge. */
  const tail  = p > 0.99 ? (p - 0.99) / 0.01 : 0;
  const shift = tail * n * (SPINE() + GUTTER());
  strip.style.minWidth  = (finder.clientWidth + shift) + "px";
  strip.style.transform = `translateX(${-shift}px)`;

  document.getElementById("st-fold").textContent =
    folded ? `${folded}/${n} folded` : "";
  paintTrail();
}

finder.addEventListener("scroll", applyScroll, { passive: true });
addEventListener("resize", () => render());

/* ═══════════════════════════════════════════════════════════════════════════
   The trail: an elbow from each selected row into the next column's header.
   The vertical run sits on the centre line of the gutter between the columns.
   ═══════════════════════════════════════════════════════════════════════════ */
function paintTrail() {
  const fr = stage.getBoundingClientRect();
  trail.setAttribute("viewBox", `0 0 ${fr.width} ${fr.height}`);
  trail.style.width = fr.width + "px"; trail.style.height = fr.height + "px";
  let out = "";

  /* a column past the crossfade midpoint anchors on its spine icon, not its rows */
  const asSpine = el => el.classList.contains("spine") || +(el.dataset.fold || 0) > 0.5;

  const cols = [...strip.querySelectorAll(".col")];
  cols.forEach((col, i) => {
    const next = cols[i + 1] || document.getElementById("preview");
    if (!next) return;
    const cr = col.getBoundingClientRect(), nr = next.getBoundingClientRect();

    /* start: right edge of the selected pill, or the spine's icon when folded */
    let x1, y1, off = 0;
    if (asSpine(col)) {
      const dot = col.querySelector(".dot").getBoundingClientRect();
      x1 = cr.right - fr.left; y1 = dot.top + dot.height / 2 - fr.top;
      if (x1 <= 0) return;   /* this spine has slid off the left edge */
    } else {
      const selRow = col.querySelector(".row.sel");
      if (!selRow) return;
      const rr = selRow.getBoundingClientRect();
      const br = col.querySelector(".col-body").getBoundingClientRect();
      let cy = rr.top + rr.height / 2;
      /* If the row is scrolled out of its own column, clamp the elbow to the
         edge and flag which way it went, rather than dropping the segment —
         a broken chain is worse than an approximate one. */
      if      (cy < br.top    + 7) { cy = br.top    + 7; off = -1; }
      else if (cy > br.bottom - 7) { cy = br.bottom - 7; off =  1; }
      x1 = (off ? cr.right - 5 : rr.right) - fr.left; y1 = cy - fr.top;
    }
    if (x1 < 0) return;   /* origin has slid off the left edge — no dangling hook */

    /* end: the next column's header — or its spine icon when that one is folded */
    const anchor = asSpine(next)
      ? next.querySelector(".dot") : next.querySelector(".col-head");
    const ar = anchor && anchor.getBoundingClientRect();
    const x2 = nr.left - fr.left;
    const y2 = ar ? ar.top + ar.height / 2 - fr.top : nr.top + 15 - fr.top;

    /* the vertical run bisects the gutter, not the pill-to-column span */
    const mx = (cr.right + nr.left) / 2 - fr.left;
    const r  = Math.min(6, Math.abs(y2 - y1) / 2, Math.abs(mx - x1), Math.abs(x2 - mx));
    const s  = Math.sign(y2 - y1) || 1;
    const dp = Math.abs(y2 - y1) < 1
      ? `M${x1},${y1} L${x2},${y2}`
      : `M${x1},${y1} L${mx - r},${y1} Q${mx},${y1} ${mx},${y1 + s*r}` +
        ` L${mx},${y2 - s*r} Q${mx},${y2} ${mx + r},${y2} L${x2},${y2}`;

    const cls = +col.dataset.i === focusCol ? "" : "thread";
    out += `<path class="${cls}" d="${dp}"/>`;
    /* apex points toward the row: off = -1 above the view, +1 below */
    if (off) out += `<path class="${cls} caret" d="M${x1-4},${y1-off*3} `
                  + `L${x1},${y1+off*4} L${x1+4},${y1-off*3}"/>`;
  });
  trail.innerHTML = out;
}

/* ═══════════════════════════════════════════════════════════════════════════
   Navigation
   ═══════════════════════════════════════════════════════════════════════════ */
function choose(colIdx, node, rowIdx) {
  const col = strip.querySelector(`.col[data-i="${colIdx}"]`);
  if (col && col.classList.contains("spine")) return unfoldTo(colIdx);
  path = path.slice(0, colIdx + 1);
  sel  = sel.slice(0, colIdx);
  sel[colIdx] = node.name;
  cursor = { [colIdx]: rowIdx };
  focusCol = colIdx;
  if (node.dir) { path.push(node); focusCol = colIdx + 1; cursor[focusCol] = 0; }
  render();
}

/* clicking a spine scrolls back just far enough to unfold it */
function unfoldTo(i) {
  finder.scrollTo({ left: Math.round(i * foldUnit() * range()), behavior: "smooth" });
}

function renderCrumbs() {
  const el = document.getElementById("crumbs");
  el.textContent = "";
  path.forEach((p, i) => {
    if (i) el.insertAdjacentHTML("beforeend", `<span class="crumb-sep">›</span>`);
    const b = document.createElement("span");
    b.className = "crumb" + (i === path.length - 1 ? " here" : "");
    b.textContent = p.name;
    b.onclick = () => { path = path.slice(0, i+1); sel = sel.slice(0, i); focusCol = i; render(); };
    el.appendChild(b);
  });
  document.getElementById("st-path").textContent =
    path.map(p => p.name).join(" / ") + (sel[path.length-1] ? " / " + sel[path.length-1] : "");
}

document.addEventListener("keydown", e => {
  const col = strip.querySelector(`.col[data-i="${focusCol}"]`);
  if (!col) return;
  const rows = [...col.querySelectorAll(".row")];
  let ci = cursor[focusCol] ?? rows.findIndex(r => r.classList.contains("sel"));
  if (ci < 0) ci = 0;

  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    ci = Math.max(0, Math.min(rows.length - 1, ci + (e.key === "ArrowDown" ? 1 : -1)));
    rows[ci].click();
    const fc = strip.querySelector(`.col[data-i="${focusCol}"]`);
    revealRow(fc.querySelector(".col-body"), fc.querySelector(".row.cursor"));
  } else if (e.key === "ArrowRight" || e.key === "Enter") {
    e.preventDefault();
    const nxt = strip.querySelector(`.col[data-i="${focusCol + 1}"]`);
    if (nxt) { focusCol++; cursor[focusCol] ??= 0;
               nxt.querySelectorAll(".row")[cursor[focusCol]]?.click(); }
  } else if (e.key === "ArrowLeft") {
    e.preventDefault();
    if (focusCol > 0) { focusCol--; if (folded > focusCol) unfoldTo(focusCol); render(true); }
  } else if (e.key === "Escape") {
    closeSettings();
  }
});

/* ═══════════════════════════════════════════════════════════════════════════
   Settings popover
   ═══════════════════════════════════════════════════════════════════════════ */
const gear = document.getElementById("gear"), panel = document.getElementById("settings");
const closeSettings = () => { panel.hidden = true; gear.setAttribute("aria-expanded", "false"); };
gear.onclick = e => {
  e.stopPropagation();
  panel.hidden = !panel.hidden;
  gear.setAttribute("aria-expanded", String(!panel.hidden));
};
document.addEventListener("click", e => { if (!panel.contains(e.target)) closeSettings(); });

const PREFS = "pykoclaw_miller_prefs";
const saved = JSON.parse(localStorage.getItem(PREFS) || "{}");
if ("dotfiles" in saved) state.dotfiles      = saved.dotfiles;
if ("density"  in saved) root.dataset.density = saved.density;
if ("theme"    in saved) root.dataset.theme   = saved.theme;

const savePrefs = () => localStorage.setItem(PREFS, JSON.stringify({
  dotfiles: state.dotfiles, density: root.dataset.density, theme: root.dataset.theme }));

const toggle = (id, get, set) => {
  const b = document.getElementById(id);
  const sync = () => b.setAttribute("aria-checked", String(get()));
  b.onclick = () => { set(!get()); sync(); savePrefs(); render(true); };
  sync();
};
toggle("s-dot",     () => state.dotfiles,                    v => state.dotfiles = v);
toggle("s-density", () => root.dataset.density === "compact",
                    v => root.dataset.density = v ? "compact" : "comfortable");
toggle("s-theme",   () => root.dataset.theme === "dark",
                    v => root.dataset.theme = v ? "dark" : "light");

document.fonts.ready.then(render);
render();
</script>
</body>
